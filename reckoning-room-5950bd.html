*{box-sizing:border-box;margin:0}
:root{--bg:#EFEEE7;--card:#F6F5EE;--ink:#26251F;--body:#43423A;--soft:#8A8574;--line:#D8D4C6;--rust:#834112;--kelp:#4A5A3E;--red:#D14625;--muse:#E7EFE9}
@media (prefers-color-scheme:dark){:root{--bg:#1D2229;--card:#242A32;--ink:#EDEBE1;--body:#C7C2B4;--soft:#6E7683;--line:#39414C;--rust:#C77B4A;--kelp:#8FA87C;--red:#E06A4A;--muse:#26302A}}
body{background:var(--bg);color:var(--body);font-family:I,system-ui,sans-serif;font-size:17px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 16px 70px}
body.focus .chrome{display:none}
body.focus{padding-top:10px}
.wrap{width:100%;max-width:760px}
.kick{font-family:M;font-size:12px;letter-spacing:.3em;color:var(--soft);text-transform:uppercase}
h1{font-family:S;font-size:clamp(26px,6vw,40px);line-height:1.04;color:var(--ink);margin:8px 0 4px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.who{font-family:M;font-size:12px;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}
.tap{cursor:pointer}.tap:hover{border-color:var(--kelp)}
.num{font-family:M;font-size:12px;color:var(--rust);letter-spacing:.1em}
.t{font-family:S;font-size:21px;color:var(--ink);line-height:1.15;margin-top:2px}
.arg{font-family:N;font-size:16px;margin-top:5px}
.chip{font-family:M;font-size:11px;color:var(--kelp)}
.chip.zero{color:var(--soft)}
.row{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;border-radius:999px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.go{background:var(--kelp);border-color:var(--kelp);color:#fff}
button.mini{padding:5px 11px;font-size:13px}
button.muse-b{border-color:var(--kelp);color:var(--kelp);font-size:14px;padding:8px 14px}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea:focus,input:focus{outline:2px solid var(--kelp)}
textarea.body{margin-top:12px;min-height:55vh;font-size:17.5px;line-height:1.7;resize:vertical}
body.focus textarea.body{min-height:78vh;font-size:19px}
textarea.arg-in{min-height:60px;margin-top:8px;font-family:N;font-size:16px}
.saved{font-family:M;font-size:12.5px;color:var(--kelp);min-height:18px}
.sect{margin-top:26px}
.canon{border-left:3px solid var(--kelp)}
.canon .bodytxt{font-family:N;font-size:16.5px;white-space:pre-wrap;margin-top:8px}
.foot{margin-top:34px;font-family:M;font-size:11px;letter-spacing:.2em;color:var(--soft);text-transform:uppercase}
.updn{display:flex;gap:4px}
.count{font-family:M;font-size:12px;color:var(--soft)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.stat b{font-family:M;font-size:22px;color:var(--ink);display:block}
.stat span{font-family:M;font-size:10.5px;letter-spacing:.14em;color:var(--soft)}
.musebox{background:var(--muse);border:1px solid var(--kelp);border-radius:12px;padding:14px 16px;margin-top:12px;white-space:pre-wrap;font-size:15.5px}
.musebox .kick{color:var(--kelp)}
.ms{font-family:S;color:var(--ink)}
.mtimer{font-family:M;font-size:15px;color:var(--rust)}
.mtext{margin-top:8px}
.ask{display:flex;gap:8px;margin-top:10px}
.ask input{flex:1}

.manu .arg{margin-bottom:8px}
.manu .btext{white-space:pre-wrap}
.manu .empty{color:var(--soft);font-family:N}

  if(d.error)throw new Error(d.error);
  return d.text;
}
async function load(){R=await rpc("rr_fetch",{})||[]}
function gate(){
  h1.textContent="Whose room?";
  stage.innerHTML=`<div class="card"><p class="t" style="font-size:18px">Your email opens it.</p>
  <input id="em" type="email" autocomplete="email" placeholder="you@..." value="${esc(st.email)}" style="margin-top:10px">
  <div class="saved" id="err"></div><div class="row"><button class="go" id="ok">Open</button></div></div>`;
  const go=async()=>{const e=document.getElementById("em").value.trim().toLowerCase();
    if(!FAMILY.includes(e)){document.getElementById("err").textContent="Not this room.";return}
    st.email=e;save();document.getElementById("err").textContent="Opening...";
    try{await load();home()}catch(x){document.getElementById("err").textContent="Room didn't answer. Try again."}};
  document.getElementById("ok").onclick=go;
  document.getElementById("em").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
}
function totals(){
  const ch=R.filter(x=>x.kind==="chapter");
  return {words:ch.reduce((a,c)=>a+wc(c.body),0),started:ch.filter(c=>wc(c.body)>0).length,n:ch.length};
}
function home(){
  document.body.classList.remove("focus");
  h1.textContent="The book, wherever you are.";who.textContent=st.email?st.email.split("@")[0]:"";
  const canon=R.filter(x=>x.kind==="canon"),ch=R.filter(x=>x.kind==="chapter"),fr=R.filter(x=>x.kind==="fragment");
  const tt=totals(),td=(st.days&&st.days[today()])||0;
  let h=`<div class="stats card"><div class="stat"><b>${tt.words.toLocaleString()}</b><span>BOOK WORDS</span></div>
  <div class="stat"><b>${td>=0?"+":""}${td.toLocaleString()}</b><span>TODAY</span></div>
  <div class="stat"><b>${tt.started}/${tt.n}</b><span>CHAPTERS STARTED</span></div>
  <div class="stat" style="margin-left:auto"><button class="go" id="manu">The Manuscript</button></div></div>`;
  canon.forEach(c=>{h+=`<div class="card canon"><span class="kick" style="letter-spacing:.2em">${esc(c.title)} &middot; FINAL</span><div class="bodytxt">${esc(c.body)}</div></div>`});
  h+=`<div class="sect"><span class="kick">CHAPTERS &middot; TAP TO WRITE &middot; ARROWS TO REORDER</span></div>`;
  ch.forEach((c,i)=>{const n=wc(c.body);
    h+=`<div class="card"><div class="bar"><div class="tap" data-k="${c.key}" style="flex:1;min-width:200px">
    <span class="num">${String(i+1).padStart(2,"0")}</span>
    <div class="t">${esc(c.title)}</div>
    <div class="arg">${esc(c.argument)}</div>
    <span class="chip ${n?"":"zero"}">${n?n+" words":"untouched"}</span></div>
    <div class="updn"><button class="mini" data-mv="-1" data-k="${c.key}">&uarr;</button><button class="mini" data-mv="1" data-k="${c.key}">&darr;</button></div>
    </div></div>`});
  h+=`<div class="row"><button id="addch">+ Add a chapter</button></div>`;
  h+=`<div class="sect"><span class="kick">FRAGMENTS &middot; ${fr.length} IN THE DRAWER</span></div>`;
  fr.forEach(f=>{const n=wc(f.body);
    h+=`<div class="card tap" data-k="${f.key}"><div class="t" style="font-size:18px">${esc(f.title)}</div><span class="chip ${n?"":"zero"}">${n?n+" words":"empty"}</span></div>`});
  h+=`<div class="row"><button id="addfr">+ New fragment</button></div>`;
  stage.innerHTML=h;
  document.querySelectorAll(".tap[data-k]").forEach(el=>el.onclick=()=>editor(el.dataset.k));
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=async ev=>{ev.stopPropagation();await rpc("rr_move",{_key:b.dataset.k,_dir:+b.dataset.mv});await load();home()});
  document.getElementById("addch").onclick=()=>create("chapter");
  document.getElementById("addfr").onclick=()=>create("fragment");
  document.getElementById("manu").onclick=manuscript;
  foot.textContent="SAVES TO THE SHED · SYNCS TO YOUR OBSIDIAN RECKONING FOLDER · THE MUSE LIVES IN EVERY CHAPTER";
}
function manuscript(){
  const ch=R.filter(x=>x.kind==="chapter"),tt=totals();
  h1.textContent="The Manuscript";who.textContent=tt.words.toLocaleString()+" words";
  let h=`<div class="card manu">`;
  ch.forEach((c,i)=>{
    h+=`<h2>${String(i+1).padStart(2,"0")} &middot; ${esc(c.title)}</h2><div class="arg">${esc(c.argument)}</div>`;
    h+=c.body.trim()?`<div class="btext">${esc(c.body)}</div>`:`<div class="empty">Not yet. It will be.</div>`;
  });
  h+=`</div><div class="row"><button class="go" id="copyall">Copy the whole draft</button><button id="back">Back to the room</button></div>`;
  stage.innerHTML=h;
  document.getElementById("copyall").onclick=async()=>{
    const parts=ch.map((c,i)=>`# ${i+1}. ${c.title}\n\n${c.body||"(not yet)"}`);
    await navigator.clipboard.writeText(parts.join("\n\n"));
    document.getElementById("copyall").textContent="Copied";
  };
  document.getElementById("back").onclick=home;
}
async function create(kind){
  const t=prompt(kind==="chapter"?"Chapter title:":"Fragment title:");
  if(!t)return;
  const k=await rpc("rr_create",{_kind:kind,_title:t});
  await load();editor(k);
}
function editor(key){
  const r=R.find(x=>x.key===key);if(!r)return home();
  h1.textContent=r.kind==="chapter"?"Chapter":"Fragment";who.textContent="";
  const chapters=R.filter(x=>x.kind==="chapter");
  const startWords=wc(r.body);
  stage.innerHTML=`<div class="card">
  <input id="ti" value="${esc(r.title)}" style="font-family:S;font-size:22px">
  ${r.kind==="chapter"?`<textarea id="ar" class="arg-in" placeholder="The one-line argument: what the reader gets.">${esc(r.argument)}</textarea>`:""}
  <textarea id="bo" class="body" placeholder="However it comes out is right. Voice-typing counts.">${esc(r.body)}</textarea>
  <div class="bar" style="margin-top:8px"><span class="saved" id="sv"></span><span class="mtimer" id="tm"></span><span class="count" id="ct">${wc(r.body)} words</span></div>
  <div class="row">
    <button class="go" id="sv-btn">Save</button>
    <button id="focus-b">Focus</button>
    <button id="sprint-b">20-min burn</button>
    ${r.kind==="fragment"&&chapters.length?`<select id="sendsel" style="width:auto"><option value="">Send to chapter...</option>${chapters.map((c,i)=>`<option value="${c.key}">${i+1}. ${esc(c.title)}</option>`).join("")}</select>`:""}
    <button id="back">Done for now</button>
  </div>
  <div class="row"><span class="kick" style="letter-spacing:.2em">THE MUSE</span>
    <button class="muse-b" data-m="unstick">Unstick me</button>
    <button class="muse-b" data-m="readback">Read it back</button>
    <button class="muse-b" data-m="grammar">Grammar pass</button>
  </div>
  <div class="ask"><input id="askin" placeholder="Or ask the Muse anything about this chapter..."><button class="muse-b" id="askb">Ask</button></div>
  <div id="museout"></div>
  </div>`;
  const bo=document.getElementById("bo"),sv=document.getElementById("sv");
  const doSave=async(quiet)=>{
    if(!quiet)sv.textContent="Saving...";
    try{
      const newWords=wc(bo.value);
      await rpc("rr_save",{_key:key,_title:document.getElementById("ti").value,
        _argument:r.kind==="chapter"?document.getElementById("ar").value:r.argument,
        _body:bo.value});
      bump(newWords-wc(r.body));r.body=bo.value;r.title=document.getElementById("ti").value;
      dirty=false;sv.textContent=quiet?"Autosaved.":"Saved.";
    }catch(x){sv.textContent="Didn't save. Copy your words somewhere safe."}
  };
  bo.addEventListener("input",()=>{dirty=true;document.getElementById("ct").textContent=wc(bo.value)+" words"});
  clearInterval(autosaveT);autosaveT=setInterval(()=>{if(dirty)doSave(true)},25000);
  document.addEventListener("keydown",function ks(e){
    if((e.metaKey||e.ctrlKey)&&e.key==="s"){e.preventDefault();doSave(false)}
    if(!document.getElementById("bo"))document.removeEventListener("keydown",ks);
  });
  document.getElementById("sv-btn").onclick=()=>doSave(false);
  document.getElementById("focus-b").onclick=()=>{document.body.classList.toggle("focus");bo.focus()};
  document.getElementById("sprint-b").onclick=()=>{
    if(sprint){clearInterval(sprint);sprint=null}
    const t0=Date.now(),w0=wc(bo.value),tm=document.getElementById("tm");
    sprint=setInterval(()=>{
      const left=1200-Math.floor((Date.now()-t0)/1000);
      if(left<=0){clearInterval(sprint);sprint=null;
        const added=wc(bo.value)-w0;
        tm.textContent=added>0?`Burn done: +${added} words. Look at you.`:"Burn done. The room stayed open. That counts.";
        doSave(true);return}
      tm.textContent=`burn: ${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;
    },1000);bo.focus();
  };
  const sendsel=document.getElementById("sendsel");
  if(sendsel)sendsel.onchange=async()=>{
    const target=R.find(x=>x.key===sendsel.value);if(!target)return;
    const merged=(target.body.trim()?target.body.trim()+"\n\n---\n\n":"")+bo.value.trim();
    await rpc("rr_save",{_key:target.key,_title:target.title,_argument:target.argument,_body:merged});
    await rpc("rr_save",{_key:key,_title:r.title,_argument:"sent to chapter: "+target.title+" ("+today()+") · "+r.argument,_body:bo.value});
    sv.textContent="Sent into \""+target.title+"\". The fragment stays here too.";
    await load();
  };
  const museGo=async(mode,ask)=>{
    const out=document.getElementById("museout");
    out.innerHTML=`<div class="musebox"><span class="kick">THE MUSE</span><div class="mtext">thinking...</div></div>`;
    try{
      const text=await muse(mode,{title:document.getElementById("ti").value,
        argument:r.kind==="chapter"?document.getElementById("ar").value:"",body:bo.value,ask:ask||""});
      out.innerHTML=`<div class="musebox"><span class="kick">THE MUSE &middot; ${mode.toUpperCase()}</span><div class="mtext">${esc(text)}</div>
      ${mode==="grammar"?`<div class="row"><button class="mini" id="applyg">Replace my text with the corrected version</button></div>`:""}</div>`;
      if(mode==="grammar"){const b=document.getElementById("applyg");
        if(b)b.onclick=()=>{const m=text.split(/\n(?=Changes|CHANGES|What changed)/)[0].trim();bo.value=m;dirty=true;document.getElementById("ct").textContent=wc(bo.value)+" words";b.textContent="Applied. Your call, always."}}
    }catch(x){out.innerHTML=`<div class="musebox"><span class="kick">THE MUSE</span><div class="mtext">${esc(x.message)}</div></div>`}
  };
  document.querySelectorAll(".muse-b[data-m]").forEach(b=>b.onclick=()=>museGo(b.dataset.m));
  document.getElementById("askb").onclick=()=>museGo("ask",document.getElementById("askin").value);
  document.getElementById("back").onclick=async()=>{if(dirty)await doSave(true);clearInterval(autosaveT);document.body.classList.remove("focus");await load();home()};
  foot.textContent="";
}
st.email&&FAMILY.includes(st.email)?(async()=>{try{await load();home()}catch(e){gate()}})():gate();
</script></body></html>
